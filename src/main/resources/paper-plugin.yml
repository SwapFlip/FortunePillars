### Plugin Name ###
name: PillarPeril

### Plugin Description ###
description: Open-Source & customizable "Pillars of Fortune"-like game — spawn on bedrock pillars, get random items, and dominate!

### Build Version ###
version: 0.2.2

### Main Class ###
main: com.marcpg.pillarperil.PillarPeril

### Loader Class ###
loader: com.marcpg.pillarperil.PPLoader

### PaperAPI Version ###
api-version: '1.20'

### Developers of the Plugin ###
authors:
  - MarcPG

### Plugin Website ###
website: https://github.com/MarcPG1905/PillarPeril

### Logging Prefix ###
prefix: PP

### Soft Dependencies ###
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true

### Permissions ###
permissions:
  pillarperil.forcestart:
    description: Allows force starting a Pillar Peril game.
    default: op
