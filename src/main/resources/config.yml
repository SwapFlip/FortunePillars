# Platform Height #
# The y-coordinate that the bedrock platforms will raise to.
# Default: 200
platform-height: 200


# Platform Material #
# The material the platforms are made of.
# Default: bedrock
platform-material: bedrock


# Pillar Distance Factor #
# The factor of the distance between platforms. This is used to determine the radius of the pillar field.
# Default: 10.0
platform-distance-factor: 10.0


# Enable Draws #
# Whether draws can happen or not, which will happen among the last players if they all die within one second,
# which almost always means they all fell off the platform at almost the same time.
# Default: false
enable-draws: false

# An ordered list of commands to execute after a game ended.
# This, unlike `queue.pre-commands` and `queue.post-commands`, will execute even if the queue is disabled.
#   Available Placeholders:
#     | -> '{id}'       : started game's ID
#     | -> '{mode}'     : started game's game-mode
#     | -> '{players}'  : amount of players in the started game
#     | -> '{world}'    : name of the game's world
#     | -> '{x}'        : the game's center location's x-component
#     | -> '{y}'        : the game's center location's y-component
#     | -> '{z}'        : the game's center location's z-component
#     | -> '{cause}'    : the cause for the game ending, in snake_case
ending-commands:
  - /say Ending game with cause {cause}... # <- example, you can freely remove this and leave the list empty.


# Respawn at Config #
# Whether to respawn players at the configured `player-spawn` below instead of making them spectate.
# If spectating (=false), it will spawn players in spectator mode in the middle of the game.
# Default: false
respawn-at-config: false


# Player Spawn #
# Where and how to spawn players after the game ends.
# If above value is set to true, players will also spawn here when dying.
player-spawn:

  # The game mode to set players to when spawning here.
  game-mode: adventure

  # The world to spawn in. The default world is called "world".
  world: crmapin

  # The location to spawn the player at.
  # If the y-component is set to -64.0, the player will spawn at the world spawn.
  location:
    x: 0.0
    y: -64.0
    z: 0.0


# Queue #
# The optional queue module for automatically starting games when enough players joined.
queue:

  # Whether the queue module is enabled or not.
  enabled: true

  # The minimum amount of players needed to start a game.
  min-players: 2

  # The maximum amount of players in a match. A game will include as many queued players as possible.
  max-players: 100

  # The interval in seconds between checking if the amount of player is valid and starting a game.
  # Set to -1 to start instantly as soon as `min-players` queued.
  check-interval: 5

  # The countdown in seconds before a game automatically starts, once the queue reached `min-players`.
  # Set to 0 to start instantly.
  # Default: 60
  start-delay: 60

  # The countdown when the queue is at least half full, up to `max-players`.
  # Default: 30
  start-delay-half: 30

  # The countdown when the queue is completely full.
  # Default: 5
  start-delay-full: 5

  # How players enter or leave the queue.
  #   Available Methods:
  #     | -> command  : use '/queue' to enter the queue
  #     | -> auto     : anyone not in a game is automatically in the queue
  method: command

  # The game mode to use when starting a new game using the queue.
  # This is also the fallback mode when no votes are cast.
  #   Available Modes:
  #     | -> normal, balanced, swapper, shuffle (new)
  #     | -> original, classic, chaos, blocky, item-only, item-shuffle, player-shuffle (legacy)
  # Default: normal
  mode: normal

  # The world to start the game in. Example value could be `game-{id}`.
  #   Available Placeholders:
  #     | -> '{id}'       : started game's ID
  #     | -> '{mode}'     : started game's game-mode
  #     | -> '{players}'  : amount of players in the started game
  world: PillarPeril

  # The location to start the game at.
  # If the y-component is set to -64.0, the game will start at the world spawn.
  location:
    x: 0.0
    y: -64.0
    z: 0.0

  # The maps that games can be played on. A random map is picked for every game.
  # If the list is empty, every saved map (via /pp map setup) can be picked.
  # Each map must have at least as many spawns as the amount of players in the game.
  map-pool: []

  # The item-time that is used when no votes are cast (in seconds).
  #   Available Vote Options: 3, 5, 10, 15
  default-item-time: 10

  # An ordered list of commands to execute before any world or location is accessed.
  # This should only really be used to create a world for the game when using another plugin like MultiVerse.
  #   Available Placeholders:
  #     | -> '{id}'       : started game's ID
  #     | -> '{mode}'     : started game's game-mode
  #     | -> '{players}'  : amount of players in the started game
  pre-commands:
    - /say Initializing game with {players} players... # <- example, you can freely remove this and leave the list empty.

  # An ordered list of commands to execute after the world and location of the game were accessed.
  # Things like creating a world for the game cannot happen here anymore.
  #   Available Placeholders:
  #     | -> '{id}'       : started game's ID
  #     | -> '{mode}'     : started game's game-mode
  #     | -> '{players}'  : amount of players in the started game
  #     | -> '{world}'    : name of the game's world
  #     | -> '{x}'        : the game's center location's x-component
  #     | -> '{y}'        : the game's center location's y-component
  #     | -> '{z}'        : the game's center location's z-component
  post-commands:
    - /say Starting game at {x}/{y}/{z}... # <- example, you can freely remove this and leave the list empty.


# Sound Effects #
sound-effects:

  # Controls all sound effects. If this is set to 'false', no sound effects will be played at all, ignoring all configuration below.
  enabled: true

  # The time in seconds when a cooldown will start playing.
  # Set to 0 to disable.
  # Default: 3
  cooldown: 3

  # Played when you receive an item.
  item: true


# Items #
# All settings related to the items players can receive.
items:

  # A list of all items which will never be given to players, independent of the game mode.
  # This already excludes all operator-only items by default.
  blacklist:
    - air
    - bedrock
    - command_block
    - chain_command_block
    - repeating_command_block
    - command_block_minecart
    - barrier
    - structure_block
    - structure_void
    - light
    - debug_stick
    - spawner
    - jigsaw
    - dragon_egg
    - ender_dragon_spawn_egg

  # The interval in seconds between removing dropped items (entities) from the arena, to prevent lag
  # in long games. Set to 0 to disable. Items that have been on the ground for less than 30 seconds are kept.
  # Default: 120
  cleanup-interval: 120

  # Whether newly received items are never placed into the currently held slot, so you can keep
  # placing blocks while collecting. If no other slot is free, the item drops on the ground instead.
  # Default: true
  avoid-held-slot: true

  # The weighted loot pool used by the "normal" game mode, inspired by CubeCraft's Pillars of Fortune.
  # Every item gets a weight; the higher the weight, the more likely it drops.
  # Unequally weighted loot makes rare/op items exciting while keeping common loot plentiful.
  pool:
    iron_sword: 15
    iron_pickaxe: 15
    iron_axe: 15
    chainmail_chestplate: 10
    leather_helmet: 10
    snowball: 10
    wooden_sword: 10
    oak_planks: 10
    cobblestone: 10
    dirt: 8
    stone: 8
    cobweb: 5
    lava_bucket: 4
    golden_apple: 3
    ender_pearl: 2
    bow: 2
    tnt: 2
    diamond_sword: 1
    diamond_helmet: 1
    obsidian: 1
    enchant_table: 1


# Scoreboard #
# The sidebar scoreboard shown during a game. Supports MiniMessage formatting and these placeholders:
#   | -> '<mode>'   : the name of the game mode
#   | -> '<type>'   : the name of the game event type (lava rises, tnt falls, ...)
#   | -> '<map>'    : the name of the map the game is played on
#   | -> '<player>' : your name
#   | -> '<time>'   : time remaining in the game
#   | -> '<kills>'  : your current kill count
# If you leave the lines list empty, the built-in default scoreboard will be used instead.
scoreboard:
  title: "<bold><gradient:#71CCF8:#FC91EC:#F87171>Pillar Peril"
  lines:
    - "<gray>Mode: <white><mode>"
    - "<gray>Type: <white><type>"
    - "<gray>Map: <white><map>"
    - "<gray>Player: <white><player>"
    - "<gray>Time left: <white><time>"
    - "<gray>Kills: <white><kills>"


# Default Game Modes #
# Allows you to configure various properties of the default game modes.
modes:

  # Example Mode - Example mode to explain what each value does.
  example:
    cooldown: 5 # The cooldown (in seconds) between receiving an item.
    time-limit: 10min # The total amount of time a game can last. Please only use one time unit.
    visual:
      color: "#FFFFFF" # The theme color (as hex code) of the game. Will be used in the scoreboard for example.
      show-scoreboard: true # Whether to show a scoreboard with some info or not.
      show-actionbar: false # Whether to show an actionbar with the item countdown or not.
      show-bossbar: false # Whether to show a bossbar with the item countdown or not.
    generator:
      horizontal: circular # The horizontal generator, so the layout of vertical pillars/blocks. Either "circular" or "random".
      vertical: pillar # The vertical generator, so the type of platform. Either "pillar" or "block".

  # Blocky Mode - Starts with a weapon; only blocks are given.
  blocky:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#FFAA00"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: false
    generator:
      horizontal: circular
      vertical: pillar

  # Chaos Mode - No filters, randomized pillars, fast item cooldown.
  chaos:
    cooldown: 3
    time-limit: 10min
    visual:
      color: "#FF5555"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: random
      vertical: pillar

  # Classic Mode - Classic rules, inspired by CubeCraft.
  classic:
    cooldown: 5
    time-limit: 10min
    visual:
      color: "#53A4FF"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: false
    generator:
      horizontal: circular
      vertical: pillar

  # Item-Only Mode - Only items (no blocks): long & tough.
  item-only:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#FFFF55"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: false
    generator:
      horizontal: circular
      vertical: pillar

  # Item Shuffle Mode - Items replaced every 10s (9 new items).
  item-shuffle:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#A3FF54"
      show-scoreboard: true
      show-actionbar: true
      show-bossbar: false
    generator:
      horizontal: circular
      vertical: pillar

  # Original Mode - Original gameplay as seen in early videos.
  original:
    cooldown: 5
    time-limit: 10min
    visual:
      color: "#FFFFFF"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: circular
      vertical: pillar

  # Player Shuffle Mode - All players randomly swapped every 10s.
  player-shuffle:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#54FFAF"
      show-scoreboard: true
      show-actionbar: true
      show-bossbar: false
    generator:
      horizontal: circular
      vertical: pillar

  # Normal Mode - Full loot table with all items.
  normal:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#FFFFFF"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: circular
      vertical: pillar

  # Balanced Mode - Mid-tier items only (no netherite, no OP apples).
  balanced:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#FFAA00"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: circular
      vertical: pillar

  # Swapper Mode - All player positions swap every 30 seconds.
  swapper:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#FF54FF"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: circular
      vertical: pillar

  # Shuffle Mode - Inventories are randomized every 60 seconds.
  shuffle:
    cooldown: 10
    time-limit: 10min
    visual:
      color: "#54FFFF"
      show-scoreboard: true
      show-actionbar: false
      show-bossbar: true
    generator:
      horizontal: circular
      vertical: pillar


# Game Event Types (Modifiers) #
# The event type voted on in the queue. Tuning options for each type.
modifiers:

  # Lava Rises - The lava level rises by one block every `interval` seconds, anchored just below
  # the map's spectator spawn (or `start-y` when the map has no spectator spawn).
  lava-rises:
    interval: 3 # Seconds between each lava level rise.
    start-y: 30 # The y-coordinate the lava starts at and rises from when the map has no spectator spawn.
    spectator-offset: 34 # Blocks below the spectator spawn the lava starts at when the map has one.
    start-delay: 60 # Seconds after the game starts before the lava begins to rise.
    size: 100 # Size of the square play area, centered on the map's spectator spawn, that the lava covers.

  # TNT Falls - TNT falls onto the play area on its own timer with a configurable fuse.
  tnt-falls:
    interval: 10 # Seconds between each round of falling TNT.
    start-delay: 60 # Seconds after the game starts before TNT begins to fall.
    fuse-ticks: 200 # The fuse duration of the falling TNT (20 ticks = 1 second).
    per-drop: 3 # Amount of TNT dropped per round, at separate random positions within the play area.
    size: 100 # Size of the square play area, centered on the map's spectator spawn, that the TNT falls into. TNT spawns from the world's height limit.


# Out-of-Bounds Radius #
# The safe zone around the map's spectator spawn (or the game center without a map). Players are free
# to leave it, but while outside they lose `damage-hearts` hearts every second - regardless of height,
# so the check covers the whole column from the void to the top of the world. No blocks are placed.
# When the game time runs out without a winner, the radius starts shrinking by `shrink-per-second`
# blocks per second until it closes in completely and the game ends.
radius:
  enabled: true # Whether the out-of-bounds damage radius is active at all.
  base-radius: 25 # Horizontal radius (in blocks) around the spectator spawn players may not leave.
  damage-hearts: 2 # Hearts of damage taken every second while outside the radius (1 heart = 1/2 of the full bar).
  shrink-per-second: 1 # Blocks the radius shrinks by every second after the time limit is reached.


# End of Game #
# Seconds to keep the game registered after it ended, so kill-cam, stats and announcements don't
# get cut off by an instant cleanup. Set to 0 to clean up instantly.
# Default: 10
time-after-game: 10


# Kill Credit Window #
# Seconds during which the last damage a player took is remembered, so void/fall knock-offs are
# credited to the player who dealt the damage.
# Default: 15
kill-credit-window: 15


# Disable FastStats Integration #
# FastStats sends completely anonymous data about the server's Minecraft version, used game modes, etc.
# to improve the plugin based on real usage data.
# If you do not want to send this data, feel free to opt out here, in FastStats' own configuration,
# or using the `-Dfaststats.enabled=false` JVM flag to disable FastStats globally.
disable-faststats: false

# The Configuration Version #
# DO NOT MODIFY THIS, OR THE CONFIGURATION WILL LIKELY BREAK OR BE RESET!
version: 10
